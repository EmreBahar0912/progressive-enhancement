<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>Rating / Progressive Enhancement / FDND</title>
		<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
		<link href="assets/styles.css" rel="stylesheet">
		<style>
			.stars {
				display: flex;
				flex-direction: row-reverse;
				justify-content: flex-end;
				gap: 4px;
			}

				.stars input {
				position: absolute;
				opacity: 0;
				width: 0;
				height: 0;
			}

				.stars label {
				font-size: 36px;
				color: #ccc;
				cursor: pointer;
				transition: color 0.1s;
			}

				.stars label:hover,
				.stars label:hover ~ label,
				.stars input:checked ~ label {
				color: #EF9F27;
			}

				.stars input:focus-visible + label {
				outline: 2px solid blue;
				border-radius: 2px;
			}
		</style>
	</head>
	<body>
		<h1>Rating</h1>

		<fieldset>
			<legend>Beoordeel ons!</legend>
			<div class="stars">
				<input type="radio" name="rating" id="s5" value="5"><label for="s5" title="5 sterren">★</label>
				<input type="radio" name="rating" id="s4" value="4"><label for="s4" title="4 sterren">★</label>
				<input type="radio" name="rating" id="s3" value="3"><label for="s3" title="3 sterren">★</label>
				<input type="radio" name="rating" id="s2" value="2"><label for="s2" title="2 sterren">★</label>
				<input type="radio" name="rating" id="s1" value="1"><label for="s1" title="1 ster">★</label>
			</div>
		</fieldset>

		<details open>
			<summary>Demo video</summary>
			<video src="assets/rating.mp4" width="271" height="110" controls muted autoplay loop>
				<a href="assets/rating.mp4">assets/rating.mp4</a>
			</video>
		</details>
	</body>
</html>
